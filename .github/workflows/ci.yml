name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (tvOS)
    # GitHub's Xcode 27 image. The project uses Xcode 27's project format, so older images can't open it.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE_VERSION: "27.2"
      SOURCE_PACKAGES: ${{ github.workspace }}/.build/SourcePackages
      RESULTS: ${{ github.workspace }}/.build/Results

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Pick a tvOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          tvos = [d for runtime, ds in sorted(devices.items(), reverse=True) if ".tvOS-" in runtime for d in ds]
          preferred = [d for d in tvos if d["name"].startswith("Apple TV 4K")] or tvos
          print(preferred[0]["udid"] if preferred else "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::No tvOS simulator is installed on this runner"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl list devices | grep "$udid"
          echo "DESTINATION=platform=tvOS Simulator,id=$udid" >> "$GITHUB_ENV"

      # AetherEngine pulls a prebuilt FFmpeg, so resolving packages from scratch is slow. The key
      # covers both lockfiles: the workspace's (app build) and the package's (package tests).
      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.SOURCE_PACKAGES }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Portfolio.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'PortfolioKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Build the PortfolioTV app
        run: |
          xcodebuild build \
            -workspace Portfolio.xcworkspace \
            -scheme PortfolioTV \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -resultBundlePath "$RESULTS/app-build.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Test PortfolioKit
        working-directory: PortfolioKit
        run: |
          xcodebuild test \
            -scheme PortfolioKit-Package \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -resultBundlePath "$RESULTS/package-tests.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize test results
        if: always()
        run: |
          bundle="$RESULTS/package-tests.xcresult"
          [ -d "$bundle" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$bundle" | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("### PortfolioKit tests: %s" % s["result"])
          print()
          print("| Total | Passed | Failed | Skipped |")
          print("|---|---|---|---|")
          print("| %d | %d | %d | %d |" % (s["totalTestCount"], s["passedTests"], s["failedTests"], s["skippedTests"]))
          for failure in s.get("testFailures", []):
              name = failure.get("testIdentifierString") or failure.get("testName", "?")
              print("- ❌ `%s`: %s" % (name, failure.get("failureText", "")))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresults
          path: ${{ env.RESULTS }}
          if-no-files-found: ignore
